<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Smoke Bar</title>
    <meta name="description" content="Free virtual cigarette in your browser: pick a pack, hold it between your fingers, draw, and blow smoke rings. No install, no tobacco, no nicotine. 18+." />
    <meta name="theme-color" content="#4A4A4A" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smoke Bar — the online smoke lounge" />
    <meta property="og:description" content="Hold it between your fingers, draw, and blow smoke. Runs entirely in your browser, nothing leaves your device." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%234A4A4A'/><circle cx='50' cy='50' r='26' fill='none' stroke='%23FFFFE3' stroke-width='9'/><circle cx='50' cy='50' r='26' fill='none' stroke='%236D8196' stroke-width='3' stroke-dasharray='26 20'/><g transform='rotate(-35 50 50)'><rect x='24' y='45' width='52' height='10' rx='3' fill='%23FFFFE3'/><rect x='24' y='45' width='15' height='10' rx='3' fill='%236D8196'/><rect x='72' y='45' width='5' height='10' rx='2' fill='%23E0762E'/></g></svg>" />
    <!-- Preload fonts -->
    <link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lora-latin-italic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preload models and wasm runtime -->
    <script>
      (function () {
        var mp = '/mediapipe/1.0.1/';
        [
          ['/models/hand_landmarker.task', 'fetch', 'high'],
          [mp + 'vision_wasm_internal.wasm', 'fetch'],
          [mp + 'vision_wasm_internal.js', 'script'],
          ['/models/face_landmarker.task', 'fetch', 'low'],
        ].forEach(function (f) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.href = f[0];
          l.as = f[1];
          l.crossOrigin = 'anonymous';
          if (f[2]) l.fetchPriority = f[2];
          document.head.appendChild(l);
        });
      })();
    </script>
    <link rel="stylesheet" crossorigin href="./style.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="fab-group" class="fab-group">
      <button id="hide-ui" class="fab" type="button" title="Hide UI (H)" aria-label="Hide all UI elements">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button id="cloud-snap" class="fab" type="button" title="Cloud Snap — download screenshot (S)" aria-label="Take a screenshot and download">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </div>
    <noscript><p>This page needs JavaScript and a camera.</p></noscript>
    <script src="/web/audio.js"></script>
    <script type="module" crossorigin src="./app.js"></script>
    <script>
      (function () {
        /* ---- Hide UI ---- */
        const hideBtn = document.getElementById('hide-ui');
        let uiHidden = false;

        function toggleUI() {
          uiHidden = !uiHidden;
          document.body.classList.toggle('ui-hidden', uiHidden);
          if (hideBtn) {
            hideBtn.title = uiHidden ? 'Show UI (H)' : 'Hide UI (H)';
            hideBtn.setAttribute('aria-label', uiHidden ? 'Show all UI elements' : 'Hide all UI elements');
            const svg = hideBtn.querySelector('svg');
            if (svg) {
              svg.innerHTML = uiHidden
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
          }
        }

        if (hideBtn) hideBtn.addEventListener('click', toggleUI);

        /* ---- Cloud Snap / Download Screenshot ---- */
        const snapBtn = document.getElementById('cloud-snap');

        function cloudSnap() {
          const canvas = document.getElementById('stage');
          if (!canvas) return;

          // Brief flash feedback
          const flash = document.createElement('div');
          flash.className = 'snap-flash';
          document.body.appendChild(flash);
          requestAnimationFrame(function () {
            flash.style.opacity = '0';
          });
          setTimeout(function () { flash.remove(); }, 350);

          canvas.toBlob(function (blob) {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            a.href = url;
            a.download = 'smoke-snap-' + ts + '.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          }, 'image/png');
        }

        if (snapBtn) snapBtn.addEventListener('click', cloudSnap);

        /* ---- Keyboard shortcuts ---- */
        document.addEventListener('keydown', function (e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
          if (e.key === 'h' || e.key === 'H') toggleUI();
          if (e.key === 's' || e.key === 'S') cloudSnap();
        });
      })();
    </script>
  </body>
</html>
